
spring.config.import=optional:file:.env[.properties]

spring.application.name=on-muhasebe-spring-boot

spring.datasource.url=jdbc:postgresql://localhost:5432/on_muhasebe_db

spring.datasource.username=bozlak

spring.datasource.password=${LOCALHOST_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# No spring.jpa.* here anymore: Spring Data JDBC neither generates DDL nor keeps a
# persistence context, so schema ownership stays entirely with the database (DB-First).
# Statement logging is a logger, not a property:
#logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG

jwt.secret=${JWT_SECRET_KEY}

# Keeps the token given to the Authorize button after a Swagger UI page refresh
springdoc.swagger-ui.persist-authorization=true